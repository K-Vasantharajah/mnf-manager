spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mnfmanager_test
    username: mnf
    password: mnf_local_password
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate must not create or drop tables
      ddl-auto: none
  flyway:
    # Tests clean and rebuild the schema each run (see CleanMigrateStrategy)
    clean-disabled: false
  sql:
    init:
      mode: never