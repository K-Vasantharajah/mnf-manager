spring:
  profiles:
    include: secrets

  application:
    name: mnf-manager

  jackson:
    serialization:
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  datasource:
    url: jdbc:postgresql://localhost:5432/mnfmanager
    username: mnf
    password: mnf_local_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-this-in-production-minimum-256-bits}
  expiration: 86400000

google:
  client-id: ${GOOGLE_CLIENT_ID:placeholder}

app:
  admin-emails: ${ADMIN_EMAILS:}

mnf:
  access-code-hash: ${MNF_ACCESS_CODE_HASH:}
  member-token-expiration: 2592000000 # 30 days
  ratings:
    # Off: ratings are admin-only. Turn on (RATINGS_PUBLIC=true) to show them
    # to members, after telling the group and updating the privacy notice.
    public: ${RATINGS_PUBLIC:false}

logging:
  level:
    # INFO in production; for local debugging, run with
    # LOGGING_LEVEL_COM_MNFMANAGER=DEBUG ./mvnw spring-boot:run
    com.mnfmanager: INFO
    org.springframework.security: INFO
