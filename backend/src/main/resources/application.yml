spring:
  profiles:
    include: secrets

  application:
    name: mnf-manager

  jackson:
    serialization:
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  datasource:
    url: jdbc:postgresql://localhost:5432/mnfmanager
    username: mnf
    password: mnf_local_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-this-in-production-minimum-256-bits}
  expiration: 86400000

google:
  client-id: ${GOOGLE_CLIENT_ID:placeholder}

admin-emails:
  - ${ADMIN_EMAIL:placeholder@gmail.com}

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:5001}

mnf:
  access-code-hash: ${MNF_ACCESS_CODE_HASH:}
  member-token-expiration: 2592000000 # 30 days

logging:
  level:
    com.mnfmanager: DEBUG
    org.springframework.security: INFO
