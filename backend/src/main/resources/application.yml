spring:
  application:
    name: mnf-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/mnfmanager
    username: mnf
    password: mnf_local_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: mnf-manager
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.mnfmanager.*"

server:
  port: 8080

jwt:
  secret: your-secret-key-change-this-in-production-minimum-256-bits
  expiration: 86400000

logging:
  level:
    com.mnfmanager: DEBUG
    org.springframework.security: INFO
