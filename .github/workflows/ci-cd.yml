name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mnfmanager_test
          POSTGRES_USER: mnf
          POSTGRES_PASSWORD: mnf_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        working-directory: backend
        run: mvn clean verify -Dspring.profiles.active=test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://mnf-backend.victoriouscoast-eac64c77.uksouth.azurecontainerapps.io

  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ml: ${{ steps.filter.outputs.ml }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            ml:
              - 'ml-service/**'

  deploy:
    name: Build and deploy
    needs: [backend, frontend, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      REGISTRY: mnfmanageracr.azurecr.io
      RESOURCE_GROUP: mnf-manager-rg
      BACKEND_URL: https://mnf-backend.victoriouscoast-eac64c77.uksouth.azurecontainerapps.io

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Log in to ACR
        run: az acr login --name mnfmanageracr

      - name: Backend
        if: needs.changes.outputs.backend == 'true'
        run: |
          IMAGE=$REGISTRY/mnf-backend:${{ github.sha }}
          docker build -t $IMAGE backend
          docker push $IMAGE
          az containerapp update --name mnf-backend \
            --resource-group $RESOURCE_GROUP --image $IMAGE

      - name: ML service
        if: needs.changes.outputs.ml == 'true'
        run: |
          IMAGE=$REGISTRY/mnf-ml-service:${{ github.sha }}
          docker build -t $IMAGE ml-service
          docker push $IMAGE
          az containerapp update --name mnf-ml-service \
            --resource-group $RESOURCE_GROUP --image $IMAGE

      - name: Frontend
        if: needs.changes.outputs.frontend == 'true'
        run: |
          IMAGE=$REGISTRY/mnf-frontend:${{ github.sha }}
          docker build --build-arg NEXT_PUBLIC_API_URL=$BACKEND_URL \
            -t $IMAGE frontend
          docker push $IMAGE
          az containerapp update --name mnf-frontend \
            --resource-group $RESOURCE_GROUP --image $IMAGE
