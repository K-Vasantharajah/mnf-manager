services:
  postgres:
    image: postgres:16
    container_name: mnf-postgres
    environment:
      POSTGRES_DB: mnfmanager
      POSTGRES_USER: mnf
      POSTGRES_PASSWORD: mnf_local_password
      # Created on first start only (when the data volume is empty)
      POSTGRES_MULTIPLE_DATABASES: mnfmanager,mnfmanager_test,mnfmanager_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create-multiple-dbs.sh:/docker-entrypoint-initdb.d/create-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnf -d mnfmanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The full stack in containers. For day-to-day development, run only postgres
  # and start the backend and frontend directly (see the README).
  backend:
    build: ./backend
    container_name: mnf-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mnfmanager
      SPRING_DATASOURCE_USERNAME: mnf
      SPRING_DATASOURCE_PASSWORD: mnf_local_password
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* values are baked in at build time
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: mnf-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Runs once and exits: docker compose run --rm ratings [--force]
  ratings:
    build: ./ml-service
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://mnf:mnf_local_password@postgres:5432/mnfmanager
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
