services:
  postgres:
    image: postgres:16
    container_name: mnf-postgres
    environment:
      POSTGRES_DB: mnfmanager
      POSTGRES_USER: mnf
      POSTGRES_PASSWORD: mnf_local_password
      POSTGRES_MULTIPLE_DATABASES: mnfmanager,mnfmanager_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create-multiple-dbs.sh:/docker-entrypoint-initdb.d/create-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnf -d mnfmanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: mnf-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mnfmanager
      SPRING_DATASOURCE_USERNAME: mnf
      SPRING_DATASOURCE_PASSWORD: mnf_local_password
      ML_SERVICE_URL: http://ml-service:5001
    depends_on:
      postgres:
        condition: service_healthy

  ml-service:
    build: ./ml-service
    container_name: mnf-ml-service
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://mnf:mnf_local_password@postgres:5432/mnfmanager
      FLASK_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: mnf-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data:
